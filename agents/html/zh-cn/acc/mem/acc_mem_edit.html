<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Edit MEM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script>{JS}</script>
    <style>{CSS}</style>
</head>
<body>
    <div>
        <div id="scroll_div" class="acc_edit">
            <!-- 分页按钮 -->
            <!-- 开始往左滑.md_type加上.--scroll 滑到底右边不显示渐层加上.--right_no_scroll  -->
            <div id="acc_edit_offset" class="md_type">
                <!-- 当前选项li 加上.--on -->
                <ul id="title_scroll" class="md_type_list">
                    <li id="acc_detail" class="--on">用户详细设定</li>
                    <li id="acc_comm">退水和限额</li>
                    <li id="acc_report">报表</li>
                    <li id="acc_eventlog">查看记录</li>
                    <li id="acc_creditlogs">额度修改记录</li>
                </ul>
            </div>
            <!-- 分页按钮 end -->
            <div id="div_acc_detail" class="accmd_detail_group">
                <!--import Detail html-->
            </div>
            <div id="div_acc_comm" class="accmd_comm_group">
                <!--import Commission html-->
            </div>
            <div id="div_acc_report" class="accedit_bg">
                <!--import Reports html-->
            </div>
            <div id="div_acc_eventlog">
                <!--import eventlog html-->
            </div>
            <div id="div_acc_creditlogs">
                <!--import eventlog html-->
            </div>
        </div>
    </div>
</body>
</html>
