<!DOCTYPE html>
<!-- saved from url=(0054)https://ag.mos022.com/tpl/en-us/ES_results_detail.html -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <script>{JS}</script>
    <style>{CSS}</style>

    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title></title>
</head>

<body>
    <div>

        <!-- 結果 detail -->
        <div id="detail_show" name="prev_scroll_lock" class="re_result_detailG">
            <h1>
                <span class="re_detailclose_btn" id="back_btn"></span>
                <ul class="re_result_detail_title">
                    <li class="word_gray">*LEAGUENAME*</li>
                    <li class="word_ellipsis">*TEAM_H*<tt class="word_lightGray"> v </tt>*TEAM_C*</li>
                    <li>*TIME*</li>
                </ul>
            </h1>



            <!-- 固定head -->
            <div id="scroll_header" class="re_result_div_head fix" style="display: none"></div>
            <!-- 固定head end -->






            <!-- 捲軸拉動時在class="re_detail_scroll"後面加上class="detail_fixed" 需固定的header元件在他原有的class後面加上class="detail_fixed_item" -->
            <div id="scroll_control" class="re_detail_scroll">

                <div class="re_reault_divG">
                    <!-- 3格灰色標題 -->
                    <div id="minute_result" class="re_result_div_head" style="display:none">
                        <div class="re_result_div_item w140px">

                        </div>
                        <div class="re_result_div_item w78px">
                            *TEAM_H*
                        </div>
                        <div class="re_result_div_item w78px">
                            *TEAM_C*
                        </div>
                    </div>
                    <!-- 3格灰色標題end -->


                    <!-- 3格內容 -->
                    <!-- START DYNAMIC BLOCK: GAME -->
                    <div class="re_result_div_body" *minute_status*"="">
                        <div class="re_result_div_item w140px">
                            Match
                        </div>
                        <div class="re_result_div_item w78px">
                            *TEAM_H_SCORE*
                        </div>
                        <div class="re_result_div_item w78px">
                            *TEAM_C_SCORE*
                        </div>
                    </div>
                    <!-- END DYNAMIC BLOCK: GAME -->
                    <!-- 3格內容end -->



                    <!-- 2格內容 -->
                    <!-- START DYNAMIC BLOCK: DURATION -->
                    <div class="re_result_div_body" *other_status*="">
                        <div class="re_result_div_item w140px">
                            Duration
                        </div>
                        <div class="re_result_div_item w172px">
                            *DURATION*
                        </div>
                    </div>
                    <!-- END DYNAMIC BLOCK: DURATION -->

                    <!-- 2格內容end -->





                    <!-- 2格灰色標題 -->
                    <div id="other_result" class="re_result_div_head" style="display:none">
                        <div class="re_result_div_item">
                            OTHER RESULTS
                        </div>
                    </div>
                    <!-- 2格灰色標題end -->




                    <!-- 2格內容 -->
                    <!-- START DYNAMIC BLOCK: WTYPE -->
                    <div class="re_result_div_body" *other_status*="">
                        <div class="re_result_div_item w160px">
                            *MORE_WTYPE*
                        </div>
                        <div class="re_result_div_item w160px ml8">
                            *RESULT*
                        </div>
                    </div>
                    <!-- END DYNAMIC BLOCK: WTYPE -->

                    <!-- 2格內容end -->

                </div>
            </div>
        </div>
        <!-- 結果 detail end -->








    </div>


</body></html>
